[project]
name = "rag-agentic-ai-roadmap"
version = "0.1.0"
description = "A hands-on roadmap for building LLM, RAG, multimodal, and agentic AI applications."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "ollama>=0.6",
    "pydantic>=2.10",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "ipywidgets>=8.1.9",
    "nbconvert>=7.16",
    "pytest>=8.3",
    "ruff>=0.14",
]
stage-01 = [
    "flask>=3.1",
    "grandalf>=0.8",
    "langchain>=1.4",
    "langchain-core>=1.7",
    "langchain-ollama>=1.1",
    "langgraph>=1.2",
    "matplotlib>=3.10",
    "numpy>=2.1",
    "tokenizers>=0.22",
]
stage-02 = [
    "beautifulsoup4>=4.15.0",
    "gradio>=6.31",
    "langchain-text-splitters>=1.1.3",
    "llama-index-core>=0.14.26",
    "llama-index-embeddings-ollama>=0.11.0",
    "llama-index-llms-ollama>=0.12.0",
    "pypdf>=7.1.1",
]
stage-03 = [
    "chromadb>=1.5.9",
    "faiss-cpu>=1.16.0",
    "langchain-chroma>=1.2.0",
]
stage-04 = [
    "llama-index-retrievers-bm25>=0.9.0",
    "sentence-transformers>=6.3.0",
    "torch>=2.15.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv]
# `uv sync` installs every stage. The stages build on each other, so to install less, name a
# stage together with the stages before it, for example:
# `uv sync --no-default-groups --group dev --group stage-01 --group stage-02`
default-groups = "all"
python-preference = "only-managed"

[tool.uv.sources]
# On Linux (CI), take the small CPU-only build of torch; the default one pulls in CUDA (several GB).
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.build-backend]
module-name = "roadmap"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
# Turkish sample text is used on purpose to show how tokenizers treat other languages.
allowed-confusables = ["ı"]

[tool.ruff.lint.per-file-ignores]
# Notebooks import mid-file on purpose so each concept is self-contained.
"*.ipynb" = ["E402"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
# pytest-asyncio comes in with LlamaIndex; set its option so it does not warn on every run.
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # Raised inside LlamaIndex, not in our code.
    "ignore:There is no current event loop:DeprecationWarning",
]
