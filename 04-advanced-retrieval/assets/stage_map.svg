<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Stage 4 path: better retrievers with LangChain, LlamaIndex retrievers with BM25, hybrid search and reranking, measuring retrieval, then the YouTube Q&amp;A project">
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .title { font-size: 18px; font-weight: 600; }
    .tag { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; }
    .bold { font-size: 15px; font-weight: 600; }
    .small { font-size: 12px; fill: #57606a; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="900" height="220" fill="#ffffff"/>
  <text x="20" y="32" class="title">Stage 4 path</text>

  <rect x="20" y="62" width="190" height="112" rx="12" fill="#E8EEF8" stroke="#4C72B0" stroke-width="1.5"/>
  <text x="36" y="86" class="tag" style="fill:#3B5E96">NOTEBOOK 1</text>
  <text x="36" y="110" class="bold">Better retrievers</text>
  <text x="36" y="134" class="small">MMR, score threshold,</text>
  <text x="36" y="152" class="small">multi-query, self-query, ...</text>

  <line x1="213" y1="118" x2="238" y2="118" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="243" y="62" width="190" height="112" rx="12" fill="#E8EEF8" stroke="#4C72B0" stroke-width="1.5"/>
  <text x="259" y="86" class="tag" style="fill:#3B5E96">NOTEBOOK 2</text>
  <text x="259" y="110" class="bold">BM25 and reranking</text>
  <text x="259" y="134" class="small">keyword search, hybrid,</text>
  <text x="259" y="152" class="small">rerankers (LlamaIndex)</text>

  <line x1="436" y1="118" x2="461" y2="118" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="466" y="62" width="190" height="112" rx="12" fill="#E8EEF8" stroke="#4C72B0" stroke-width="1.5"/>
  <text x="482" y="86" class="tag" style="fill:#3B5E96">NOTEBOOK 3</text>
  <text x="482" y="110" class="bold">Measuring retrieval</text>
  <text x="482" y="134" class="small">hit@k, MRR, and time:</text>
  <text x="482" y="152" class="small">which retriever wins?</text>

  <line x1="659" y1="118" x2="684" y2="118" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="689" y="62" width="190" height="112" rx="12" fill="#E9F5EC" stroke="#55A868" stroke-width="1.5"/>
  <text x="705" y="86" class="tag" style="fill:#2F7A45">PROJECT</text>
  <text x="705" y="110" class="bold">YouTube Q&amp;A</text>
  <text x="705" y="134" class="small">summarize a video and</text>
  <text x="705" y="152" class="small">chat about it</text>

  <text x="20" y="206" class="small">Stages 2 and 3 searched with "embed the question, keep the top k". This stage makes that search smarter, and measures it.</text>
</svg>
