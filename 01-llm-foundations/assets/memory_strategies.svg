<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="Three memory strategies: send the full history, send only the last messages, or send a summary plus the last messages">
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .title { font-size: 18px; font-weight: 600; }
    .head { font-size: 14px; font-weight: 600; }
    .small { font-size: 12px; fill: #57606a; }
    .good { font-size: 12px; fill: #2F7A45; }
    .bad { font-size: 12px; fill: #B4363C; }
    .msg { font-size: 11px; fill: #1f2328; }
  </style>
  <rect width="900" height="330" fill="#ffffff"/>
  <text x="20" y="32" class="title">What do we send to the model on each turn?</text>
  <text x="250" y="58" class="small">messages sent with the new question (oldest → newest)</text>

  <!-- full history -->
  <text x="20" y="96" class="head">Full history</text>
  <text x="20" y="114" class="small">send every message</text>
  <g stroke-width="1.2">
    <rect x="250" y="80" width="40" height="36" rx="5" fill="#EFEDF7" stroke="#8172B3"/>
    <rect x="296" y="80" width="40" height="36" rx="5" fill="#FCEFE6" stroke="#DD8452"/>
    <rect x="342" y="80" width="40" height="36" rx="5" fill="#E8EEF8" stroke="#4C72B0"/>
    <rect x="388" y="80" width="40" height="36" rx="5" fill="#FCEFE6" stroke="#DD8452"/>
    <rect x="434" y="80" width="40" height="36" rx="5" fill="#E8EEF8" stroke="#4C72B0"/>
    <rect x="480" y="80" width="40" height="36" rx="5" fill="#FCEFE6" stroke="#DD8452"/>
    <rect x="526" y="80" width="40" height="36" rx="5" fill="#E8EEF8" stroke="#4C72B0"/>
    <rect x="572" y="80" width="40" height="36" rx="5" fill="#FCEFE6" stroke="#DD8452" stroke-width="2"/>
  </g>
  <text x="270" y="102" class="msg" text-anchor="middle">sys</text>
  <text x="592" y="102" class="msg" text-anchor="middle">new</text>
  <text x="640" y="94" class="good">+ remembers everything</text>
  <text x="640" y="112" class="bad">− grows every turn, then too long</text>

  <!-- trimmed -->
  <text x="20" y="186" class="head">Trimmed</text>
  <text x="20" y="204" class="small">keep only the last messages</text>
  <g stroke-width="1.2">
    <rect x="250" y="170" width="40" height="36" rx="5" fill="#EFEDF7" stroke="#8172B3"/>
    <rect x="296" y="170" width="40" height="36" rx="5" fill="#ffffff" stroke="#D0D7DE" stroke-dasharray="3 3"/>
    <rect x="342" y="170" width="40" height="36" rx="5" fill="#ffffff" stroke="#D0D7DE" stroke-dasharray="3 3"/>
    <rect x="388" y="170" width="40" height="36" rx="5" fill="#ffffff" stroke="#D0D7DE" stroke-dasharray="3 3"/>
    <rect x="434" y="170" width="40" height="36" rx="5" fill="#ffffff" stroke="#D0D7DE" stroke-dasharray="3 3"/>
    <rect x="480" y="170" width="40" height="36" rx="5" fill="#FCEFE6" stroke="#DD8452"/>
    <rect x="526" y="170" width="40" height="36" rx="5" fill="#E8EEF8" stroke="#4C72B0"/>
    <rect x="572" y="170" width="40" height="36" rx="5" fill="#FCEFE6" stroke="#DD8452" stroke-width="2"/>
  </g>
  <text x="270" y="192" class="msg" text-anchor="middle">sys</text>
  <text x="385" y="223" class="small" text-anchor="middle">dropped</text>
  <text x="592" y="192" class="msg" text-anchor="middle">new</text>
  <text x="640" y="184" class="good">+ stays short and cheap</text>
  <text x="640" y="202" class="bad">− forgets early facts</text>

  <!-- summary -->
  <text x="20" y="276" class="head">Summary</text>
  <text x="20" y="294" class="small">summary of old + last messages</text>
  <g stroke-width="1.2">
    <rect x="250" y="260" width="40" height="36" rx="5" fill="#EFEDF7" stroke="#8172B3"/>
    <rect x="296" y="260" width="178" height="36" rx="5" fill="#E9F5EC" stroke="#55A868"/>
    <rect x="480" y="260" width="40" height="36" rx="5" fill="#FCEFE6" stroke="#DD8452"/>
    <rect x="526" y="260" width="40" height="36" rx="5" fill="#E8EEF8" stroke="#4C72B0"/>
    <rect x="572" y="260" width="40" height="36" rx="5" fill="#FCEFE6" stroke="#DD8452" stroke-width="2"/>
  </g>
  <text x="270" y="282" class="msg" text-anchor="middle">sys</text>
  <text x="385" y="282" class="msg" text-anchor="middle">summary of older turns</text>
  <text x="592" y="282" class="msg" text-anchor="middle">new</text>
  <text x="640" y="274" class="good">+ short, keeps key facts</text>
  <text x="640" y="292" class="bad">− one extra model call to summarize</text>
</svg>
