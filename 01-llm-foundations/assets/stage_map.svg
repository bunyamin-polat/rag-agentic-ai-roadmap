<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-label="Stage 1 path: prompt engineering, LangChain basics, memory tools and agents, then the Message Analyzer project">
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .title { font-size: 18px; font-weight: 600; }
    .tag { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; }
    .bold { font-size: 15px; font-weight: 600; }
    .small { font-size: 12px; fill: #57606a; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="900" height="200" fill="#ffffff"/>
  <text x="20" y="32" class="title">Stage 1 path</text>

  <!-- 1 -->
  <rect x="20" y="60" width="190" height="112" rx="12" fill="#E8EEF8" stroke="#4C72B0" stroke-width="1.5"/>
  <text x="36" y="84" class="tag" style="fill:#3B5E96">NOTEBOOK 1</text>
  <text x="36" y="108" class="bold">Prompt engineering</text>
  <text x="36" y="132" class="small">tokens, temperature,</text>
  <text x="36" y="150" class="small">prompting techniques</text>

  <line x1="213" y1="116" x2="238" y2="116" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2 -->
  <rect x="243" y="60" width="190" height="112" rx="12" fill="#E8EEF8" stroke="#4C72B0" stroke-width="1.5"/>
  <text x="259" y="84" class="tag" style="fill:#3B5E96">NOTEBOOK 2</text>
  <text x="259" y="108" class="bold">LangChain basics</text>
  <text x="259" y="132" class="small">models, templates,</text>
  <text x="259" y="150" class="small">chains, output parsers</text>

  <line x1="436" y1="116" x2="461" y2="116" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3 -->
  <rect x="466" y="60" width="190" height="112" rx="12" fill="#E8EEF8" stroke="#4C72B0" stroke-width="1.5"/>
  <text x="482" y="84" class="tag" style="fill:#3B5E96">NOTEBOOK 3</text>
  <text x="482" y="108" class="bold">Memory, tools, agents</text>
  <text x="482" y="132" class="small">chat history, tool calls,</text>
  <text x="482" y="150" class="small">your first agent</text>

  <line x1="659" y1="116" x2="684" y2="116" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- project -->
  <rect x="689" y="60" width="190" height="112" rx="12" fill="#E9F5EC" stroke="#55A868" stroke-width="1.5"/>
  <text x="705" y="84" class="tag" style="fill:#2F7A45">PROJECT</text>
  <text x="705" y="108" class="bold">Message Analyzer</text>
  <text x="705" y="132" class="small">Flask web app with</text>
  <text x="705" y="150" class="small">structured output</text>
</svg>
