<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="A direct answer jumps to a wrong result; step-by-step reasoning reaches the right one">
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .title { font-size: 18px; font-weight: 600; }
    .row { font-size: 13px; font-weight: 600; fill: #57606a; }
    .label { font-size: 14px; }
    .bold { font-size: 14px; font-weight: 600; }
    .small { font-size: 12px; fill: #57606a; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="900" height="250" fill="#ffffff"/>
  <text x="20" y="32" class="title">Direct answer vs. chain-of-thought</text>
  <text x="20" y="54" class="small">Lily pads double in size every day and cover the whole lake on day 48. On which day was half the lake covered?</text>

  <!-- direct -->
  <text x="20" y="104" class="row">Direct</text>
  <rect x="100" y="80" width="120" height="40" rx="8" fill="#FCEFE6" stroke="#DD8452" stroke-width="1.5"/>
  <text x="160" y="105" class="label" text-anchor="middle">Question</text>
  <line x1="224" y1="100" x2="246" y2="100" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="250" y="80" width="130" height="40" rx="8" fill="#FBEAEA" stroke="#C44E52" stroke-width="1.5"/>
  <text x="315" y="105" class="bold" text-anchor="middle">Day 24  ✗</text>
  <text x="392" y="105" class="small">a quick guess: "half of 48"</text>

  <!-- chain of thought -->
  <text x="20" y="184" class="row">Step by step</text>
  <rect x="100" y="160" width="120" height="40" rx="8" fill="#FCEFE6" stroke="#DD8452" stroke-width="1.5"/>
  <text x="160" y="185" class="label" text-anchor="middle">Question</text>
  <line x1="224" y1="180" x2="246" y2="180" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="250" y="160" width="150" height="40" rx="8" fill="#E8EEF8" stroke="#4C72B0" stroke-width="1.5"/>
  <text x="325" y="185" class="label" text-anchor="middle">Day 48: lake full</text>
  <line x1="404" y1="180" x2="426" y2="180" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="430" y="160" width="170" height="40" rx="8" fill="#E8EEF8" stroke="#4C72B0" stroke-width="1.5"/>
  <text x="515" y="185" class="label" text-anchor="middle">Size doubles each day</text>
  <line x1="604" y1="180" x2="626" y2="180" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="630" y="160" width="140" height="40" rx="8" fill="#E8EEF8" stroke="#4C72B0" stroke-width="1.5"/>
  <text x="700" y="185" class="label" text-anchor="middle">Day 47: half full</text>
  <line x1="774" y1="180" x2="796" y2="180" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="800" y="160" width="90" height="40" rx="8" fill="#E9F5EC" stroke="#55A868" stroke-width="1.5"/>
  <text x="845" y="185" class="bold" text-anchor="middle">Day 47  ✓</text>

  <text x="100" y="232" class="small">Writing the steps down gives the model room to work the problem out before it answers.</text>
</svg>
