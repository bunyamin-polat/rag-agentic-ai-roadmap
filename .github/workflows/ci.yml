name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest

      # Each project has its own conftest.py and runs in a separate pytest process,
      # so modules with the same name (app.py, ...) in different projects never clash.
      - name: Run project tests
        run: |
          for conftest in $(git ls-files '*/conftest.py'); do
            uv run pytest "$(dirname "$conftest")"
          done
