<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Agentic RAG: the agent decides how many searches to run, from none for small talk to one per part of a question">
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .title { font-size: 18px; font-weight: 600; }
    .bold { font-size: 14px; font-weight: 600; }
    .label { font-size: 13px; }
    .small { font-size: 12px; fill: #57606a; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="900" height="300" fill="#ffffff"/>
  <text x="20" y="32" class="title">Agentic RAG: search is a tool, the agent decides when to use it</text>

  <!-- row 1: two-part question -->
  <rect x="20" y="56" width="250" height="48" rx="8" fill="#FCEFE6" stroke="#DD8452" stroke-width="1.5"/>
  <text x="34" y="77" class="label">"How much is the learning budget,</text>
  <text x="34" y="94" class="label">and do I need the VPN for email?"</text>
  <line x1="274" y1="80" x2="306" y2="80" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="310" y="56" width="110" height="48" rx="10" fill="#E8EEF8" stroke="#4C72B0" stroke-width="2"/>
  <text x="365" y="85" class="bold" text-anchor="middle">Agent</text>
  <g stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M424,74 C450,74 450,62 476,62"/>
    <path d="M424,88 C450,88 450,100 476,100"/>
  </g>
  <rect x="480" y="48" width="220" height="28" rx="6" fill="#EFEDF7" stroke="#8172B3" stroke-width="1.5"/>
  <text x="492" y="67" class="mono">search("learning budget")</text>
  <rect x="480" y="86" width="220" height="28" rx="6" fill="#EFEDF7" stroke="#8172B3" stroke-width="1.5"/>
  <text x="492" y="105" class="mono">search("VPN email")</text>
  <text x="720" y="85" class="small">two parts → two searches</text>

  <!-- row 2: follow-up -->
  <rect x="20" y="138" width="250" height="40" rx="8" fill="#FCEFE6" stroke="#DD8452" stroke-width="1.5"/>
  <text x="34" y="163" class="label">"How fast do I have to report it?"</text>
  <line x1="274" y1="158" x2="306" y2="158" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="310" y="134" width="110" height="48" rx="10" fill="#E8EEF8" stroke="#4C72B0" stroke-width="2"/>
  <text x="365" y="163" class="bold" text-anchor="middle">Agent</text>
  <line x1="424" y1="158" x2="476" y2="158" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="480" y="144" width="220" height="28" rx="6" fill="#EFEDF7" stroke="#8172B3" stroke-width="1.5"/>
  <text x="492" y="163" class="mono">search("lost phone ...")</text>
  <text x="720" y="163" class="small">writes its own query</text>

  <!-- row 3: small talk -->
  <rect x="20" y="212" width="250" height="40" rx="8" fill="#FCEFE6" stroke="#DD8452" stroke-width="1.5"/>
  <text x="34" y="237" class="label">"Thanks, that helps!"</text>
  <line x1="274" y1="232" x2="306" y2="232" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="310" y="208" width="110" height="48" rx="10" fill="#E8EEF8" stroke="#4C72B0" stroke-width="2"/>
  <text x="365" y="237" class="bold" text-anchor="middle">Agent</text>
  <line x1="424" y1="232" x2="476" y2="232" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="480" y="218" width="220" height="28" rx="6" fill="#E9F5EC" stroke="#55A868" stroke-width="1.5"/>
  <text x="492" y="237" class="label">answers without searching</text>
  <text x="720" y="237" class="small">no search needed</text>

  <text x="20" y="286" class="small">A chain always runs exactly one search. An agent runs as many as it needs, but its choices depend on the tool description.</text>
</svg>
