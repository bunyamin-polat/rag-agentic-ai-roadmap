<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" role="img" aria-label="Without RAG the model guesses; with RAG it first finds the right part of your documents and answers from it">
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .title { font-size: 18px; font-weight: 600; }
    .row { font-size: 13px; font-weight: 600; fill: #57606a; }
    .bold { font-size: 14px; font-weight: 600; }
    .label { font-size: 13px; }
    .small { font-size: 12px; fill: #57606a; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="900" height="270" fill="#ffffff"/>
  <text x="20" y="32" class="title">Why RAG? The model does not know your documents</text>

  <!-- without RAG -->
  <text x="20" y="92" class="row">Without RAG</text>
  <rect x="130" y="66" width="190" height="44" rx="8" fill="#FCEFE6" stroke="#DD8452" stroke-width="1.5"/>
  <text x="225" y="93" class="label" text-anchor="middle">How many vacation days?</text>
  <line x1="324" y1="88" x2="512" y2="88" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="516" y="66" width="120" height="44" rx="10" fill="#E8EEF8" stroke="#4C72B0" stroke-width="2"/>
  <text x="576" y="93" class="bold" text-anchor="middle">LLM</text>
  <line x1="640" y1="88" x2="682" y2="88" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="686" y="66" width="194" height="44" rx="8" fill="#FBEAEA" stroke="#C44E52" stroke-width="1.5"/>
  <text x="783" y="88" class="bold" text-anchor="middle">"15 days"  ✗</text>
  <text x="783" y="103" class="small" text-anchor="middle">a confident guess</text>

  <!-- with RAG -->
  <text x="20" y="192" class="row">With RAG</text>
  <rect x="130" y="166" width="190" height="44" rx="8" fill="#FCEFE6" stroke="#DD8452" stroke-width="1.5"/>
  <text x="225" y="193" class="label" text-anchor="middle">How many vacation days?</text>
  <line x1="324" y1="188" x2="352" y2="188" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="356" y="150" width="130" height="76" rx="10" fill="#EFEDF7" stroke="#8172B3" stroke-width="1.5"/>
  <text x="421" y="178" class="bold" text-anchor="middle">Search the</text>
  <text x="421" y="196" class="bold" text-anchor="middle">handbook</text>
  <text x="421" y="214" class="small" text-anchor="middle">"3. Vacation ..."</text>
  <line x1="490" y1="188" x2="512" y2="188" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="516" y="158" width="120" height="60" rx="10" fill="#E8EEF8" stroke="#4C72B0" stroke-width="2"/>
  <text x="576" y="184" class="bold" text-anchor="middle">LLM</text>
  <text x="576" y="202" class="small" text-anchor="middle">question + text</text>
  <line x1="640" y1="188" x2="682" y2="188" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="686" y="166" width="194" height="44" rx="8" fill="#E9F5EC" stroke="#55A868" stroke-width="1.5"/>
  <text x="783" y="188" class="bold" text-anchor="middle">"28 days"  ✓</text>
  <text x="783" y="203" class="small" text-anchor="middle">taken from the handbook</text>

  <text x="20" y="254" class="small">RAG = Retrieval-Augmented Generation: first retrieve the relevant text, then let the model generate an answer from it.</text>
</svg>
