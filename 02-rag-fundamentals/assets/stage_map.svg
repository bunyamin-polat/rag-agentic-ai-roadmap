<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Stage 2 path: the RAG pipeline, loaders and chunking, conversational RAG, then the PDF Q&amp;A bot and profile chat projects">
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .title { font-size: 18px; font-weight: 600; }
    .tag { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; }
    .bold { font-size: 15px; font-weight: 600; }
    .small { font-size: 12px; fill: #57606a; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="900" height="220" fill="#ffffff"/>
  <text x="20" y="32" class="title">Stage 2 path</text>

  <!-- notebook 1 -->
  <rect x="20" y="62" width="190" height="112" rx="12" fill="#E8EEF8" stroke="#4C72B0" stroke-width="1.5"/>
  <text x="36" y="86" class="tag" style="fill:#3B5E96">NOTEBOOK 1</text>
  <text x="36" y="110" class="bold">The RAG pipeline</text>
  <text x="36" y="134" class="small">load, split, embed,</text>
  <text x="36" y="152" class="small">store, retrieve, answer</text>

  <line x1="213" y1="118" x2="238" y2="118" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- notebook 2 -->
  <rect x="243" y="62" width="190" height="112" rx="12" fill="#E8EEF8" stroke="#4C72B0" stroke-width="1.5"/>
  <text x="259" y="86" class="tag" style="fill:#3B5E96">NOTEBOOK 2</text>
  <text x="259" y="110" class="bold">Loaders and chunking</text>
  <text x="259" y="134" class="small">PDFs, web pages,</text>
  <text x="259" y="152" class="small">chunk size and overlap</text>

  <line x1="436" y1="118" x2="461" y2="118" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- notebook 3 -->
  <rect x="466" y="62" width="190" height="112" rx="12" fill="#E8EEF8" stroke="#4C72B0" stroke-width="1.5"/>
  <text x="482" y="86" class="tag" style="fill:#3B5E96">NOTEBOOK 3</text>
  <text x="482" y="110" class="bold">Conversational RAG</text>
  <text x="482" y="134" class="small">follow-up questions,</text>
  <text x="482" y="152" class="small">RAG as an agent tool</text>

  <g stroke="#57606a" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M659,118 C672,118 672,84 684,84"/>
    <path d="M659,118 C672,118 672,152 684,152"/>
  </g>

  <!-- projects -->
  <rect x="689" y="56" width="190" height="56" rx="12" fill="#E9F5EC" stroke="#55A868" stroke-width="1.5"/>
  <text x="705" y="78" class="tag" style="fill:#2F7A45">PROJECT</text>
  <text x="705" y="99" class="bold">PDF Q&amp;A bot</text>
  <rect x="689" y="124" width="190" height="56" rx="12" fill="#E9F5EC" stroke="#55A868" stroke-width="1.5"/>
  <text x="705" y="146" class="tag" style="fill:#2F7A45">PROJECT</text>
  <text x="705" y="167" class="bold">Profile chat</text>

  <text x="20" y="206" class="small">The projects use LangChain (PDF Q&amp;A bot) and LlamaIndex (profile chat), so you see two frameworks for the same idea.</text>
</svg>
