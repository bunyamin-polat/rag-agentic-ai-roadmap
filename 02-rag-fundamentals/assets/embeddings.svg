<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="An embedding model turns each text into a list of numbers; texts with similar meaning end up close together">
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .title { font-size: 18px; font-weight: 600; }
    .label { font-size: 13px; }
    .bold { font-size: 14px; font-weight: 600; }
    .small { font-size: 12px; fill: #57606a; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
    .dot { font-size: 12px; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="900" height="300" fill="#ffffff"/>
  <text x="20" y="32" class="title">Embeddings: meaning as numbers</text>

  <!-- texts -->
  <g stroke-width="1.5">
    <rect x="20" y="60" width="210" height="34" rx="8" fill="#FCEFE6" stroke="#DD8452"/>
    <rect x="20" y="102" width="210" height="34" rx="8" fill="#FCEFE6" stroke="#DD8452"/>
    <rect x="20" y="144" width="210" height="34" rx="8" fill="#E8EEF8" stroke="#4C72B0"/>
    <rect x="20" y="186" width="210" height="34" rx="8" fill="#E8EEF8" stroke="#4C72B0"/>
  </g>
  <text x="34" y="82" class="label">How many days off do I get?</text>
  <text x="34" y="124" class="label">Vacation days per year</text>
  <text x="34" y="166" class="label">I lost my laptop.</text>
  <text x="34" y="208" class="label">Report stolen devices</text>

  <line x1="236" y1="140" x2="276" y2="140" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="280" y="104" width="130" height="72" rx="12" fill="#EFEDF7" stroke="#8172B3" stroke-width="2"/>
  <text x="345" y="134" class="bold" text-anchor="middle">Embedding</text>
  <text x="345" y="152" class="bold" text-anchor="middle">model</text>
  <line x1="414" y1="140" x2="454" y2="140" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- vectors -->
  <rect x="458" y="60" width="190" height="160" rx="8" fill="#F6F8FA" stroke="#8C959F" stroke-width="1.5"/>
  <text x="472" y="82" class="mono">[ 0.12, -0.53, ...]</text>
  <text x="472" y="124" class="mono">[ 0.10, -0.49, ...]</text>
  <text x="472" y="166" class="mono">[-0.71,  0.08, ...]</text>
  <text x="472" y="208" class="mono">[-0.68,  0.11, ...]</text>
  <text x="553" y="240" class="small" text-anchor="middle">768 numbers per text</text>

  <!-- map -->
  <rect x="680" y="60" width="200" height="160" rx="8" fill="#ffffff" stroke="#D0D7DE" stroke-width="1.5"/>
  <ellipse cx="740" cy="105" rx="42" ry="28" fill="#FCEFE6" stroke="#DD8452" stroke-dasharray="4 3"/>
  <circle cx="728" cy="100" r="6" fill="#DD8452"/>
  <circle cx="752" cy="112" r="6" fill="#DD8452"/>
  <text x="740" y="146" class="small" text-anchor="middle">vacation</text>
  <ellipse cx="828" cy="160" rx="40" ry="26" fill="#E8EEF8" stroke="#4C72B0" stroke-dasharray="4 3"/>
  <circle cx="816" cy="156" r="6" fill="#4C72B0"/>
  <circle cx="840" cy="166" r="6" fill="#4C72B0"/>
  <text x="828" y="204" class="small" text-anchor="middle">lost devices</text>
  <text x="780" y="240" class="small" text-anchor="middle">similar meaning = close together</text>

  <text x="20" y="282" class="small">Search compares the question's vector with every chunk's vector and returns the closest ones, even when they share no words.</text>
</svg>
