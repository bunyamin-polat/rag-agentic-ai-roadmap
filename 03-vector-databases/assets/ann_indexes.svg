<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="Four ways to search: Flat compares with every vector, IVF searches only nearby clusters, HNSW walks a graph of neighbors, LSH compares short bit codes">
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .title { font-size: 18px; font-weight: 600; }
    .tag { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; }
    .bold { font-size: 14px; font-weight: 600; }
    .small { font-size: 12px; fill: #57606a; }
    .tiny { font-size: 10px; fill: #57606a; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; font-weight: 600; fill: #8C959F; }
  </style>
  <rect width="900" height="360" fill="#ffffff"/>
  <text x="20" y="30" class="title">Four ways to find the nearest vectors</text>

  <!-- ============ FLAT ============ -->
  <rect x="20" y="44" width="205" height="270" rx="12" fill="#F6F8FA" stroke="#8C959F" stroke-width="1.5"/>
  <text x="34" y="66" class="tag" style="fill:#57606a">FLAT</text>
  <text x="34" y="86" class="bold">Compare with all</text>
  <g stroke="#B6C3DA" stroke-width="1">
    <line x1="120" y1="165" x2="50" y2="110"/><line x1="120" y1="165" x2="80" y2="130"/>
    <line x1="120" y1="165" x2="70" y2="215"/><line x1="120" y1="165" x2="110" y2="108"/>
    <line x1="120" y1="165" x2="130" y2="232"/><line x1="120" y1="165" x2="165" y2="118"/>
    <line x1="120" y1="165" x2="195" y2="150"/><line x1="120" y1="165" x2="180" y2="215"/>
    <line x1="120" y1="165" x2="92" y2="182"/><line x1="120" y1="165" x2="150" y2="180"/>
    <line x1="120" y1="165" x2="52" y2="160"/><line x1="120" y1="165" x2="200" y2="236"/>
  </g>
  <g fill="#8C959F">
    <circle cx="50" cy="110" r="4"/><circle cx="80" cy="130" r="4"/><circle cx="70" cy="215" r="4"/>
    <circle cx="110" cy="108" r="4"/><circle cx="130" cy="232" r="4"/><circle cx="165" cy="118" r="4"/>
    <circle cx="195" cy="150" r="4"/><circle cx="180" cy="215" r="4"/><circle cx="92" cy="182" r="4"/>
    <circle cx="150" cy="180" r="4"/><circle cx="52" cy="160" r="4"/><circle cx="200" cy="236" r="4"/>
  </g>
  <circle cx="120" cy="165" r="6" fill="#4C72B0"/>
  <text x="34" y="270" class="small">exact, but every query</text>
  <text x="34" y="287" class="small">checks every vector</text>

  <!-- ============ IVF ============ -->
  <rect x="240" y="44" width="205" height="270" rx="12" fill="#F6F8FA" stroke="#8C959F" stroke-width="1.5"/>
  <text x="254" y="66" class="tag" style="fill:#57606a">IVF</text>
  <text x="254" y="86" class="bold">Search nearby clusters</text>
  <rect x="342" y="100" width="90" height="70" fill="#E8EEF8"/>
  <g stroke="#8C959F" stroke-width="1.2" stroke-dasharray="4 3">
    <line x1="342" y1="100" x2="342" y2="242"/>
    <line x1="252" y1="170" x2="432" y2="170"/>
  </g>
  <g stroke="#B6C3DA" stroke-width="1">
    <line x1="372" y1="148" x2="370" y2="118"/><line x1="372" y1="148" x2="400" y2="126"/>
    <line x1="372" y1="148" x2="412" y2="152"/>
  </g>
  <g fill="#8C959F">
    <circle cx="272" cy="118" r="4"/><circle cx="300" cy="140" r="4"/><circle cx="318" cy="114" r="4"/>
    <circle cx="370" cy="118" r="4"/><circle cx="400" cy="126" r="4"/><circle cx="412" cy="152" r="4"/>
    <circle cx="276" cy="200" r="4"/><circle cx="304" cy="222" r="4"/><circle cx="322" cy="192" r="4"/>
    <circle cx="366" cy="206" r="4"/><circle cx="398" cy="188" r="4"/><circle cx="410" cy="226" r="4"/>
  </g>
  <g stroke="#57606a" stroke-width="2">
    <path d="M292,124 l8,8 M300,124 l-8,8"/><path d="M386,136 l8,8 M394,136 l-8,8"/>
    <path d="M292,203 l8,8 M300,203 l-8,8"/><path d="M386,203 l8,8 M394,203 l-8,8"/>
  </g>
  <circle cx="372" cy="148" r="6" fill="#4C72B0"/>
  <text x="254" y="258" class="tiny">× = cluster center</text>
  <text x="254" y="276" class="small">group the vectors once, then</text>
  <text x="254" y="293" class="small">search only the closest groups</text>

  <!-- ============ HNSW ============ -->
  <rect x="460" y="44" width="205" height="270" rx="12" fill="#F6F8FA" stroke="#8C959F" stroke-width="1.5"/>
  <text x="474" y="66" class="tag" style="fill:#57606a">HNSW</text>
  <text x="474" y="86" class="bold">Walk a neighbor graph</text>
  <text x="474" y="104" class="tiny">top layer: few vectors, long links</text>
  <g stroke="#B6C3DA" stroke-width="1.5">
    <line x1="490" y1="124" x2="560" y2="117"/><line x1="560" y1="117" x2="630" y2="128"/>
  </g>
  <g stroke="#D0D7DE" stroke-width="1" stroke-dasharray="3 3">
    <line x1="490" y1="128" x2="490" y2="168"/><line x1="560" y1="121" x2="560" y2="161"/>
    <line x1="630" y1="132" x2="630" y2="172"/>
  </g>
  <line x1="472" y1="145" x2="652" y2="145" stroke="#EAEEF2"/>
  <text x="474" y="252" class="tiny">bottom layer: all vectors</text>
  <g stroke="#B6C3DA" stroke-width="1.2">
    <line x1="490" y1="172" x2="560" y2="165"/><line x1="560" y1="165" x2="630" y2="176"/>
    <line x1="490" y1="172" x2="518" y2="212"/><line x1="518" y1="212" x2="484" y2="230"/>
    <line x1="560" y1="165" x2="584" y2="198"/><line x1="584" y1="198" x2="604" y2="228"/>
    <line x1="630" y1="176" x2="646" y2="216"/><line x1="604" y1="228" x2="646" y2="216"/>
    <line x1="518" y1="212" x2="584" y2="198"/>
  </g>
  <g stroke="#4C72B0" stroke-width="2.5" fill="none">
    <path d="M490,124 L560,117"/><path d="M560,121 L560,161"/><path d="M560,165 L584,198"/><path d="M584,198 L604,228"/>
  </g>
  <g fill="#8C959F">
    <circle cx="490" cy="124" r="4"/><circle cx="560" cy="117" r="4"/><circle cx="630" cy="128" r="4"/>
    <circle cx="490" cy="172" r="4"/><circle cx="560" cy="165" r="4"/><circle cx="630" cy="176" r="4"/>
    <circle cx="518" cy="212" r="4"/><circle cx="484" cy="230" r="4"/><circle cx="584" cy="198" r="4"/>
    <circle cx="604" cy="228" r="4"/><circle cx="646" cy="216" r="4"/>
  </g>
  <circle cx="616" cy="214" r="6" fill="#4C72B0"/>
  <text x="474" y="276" class="small">jump far on top, then step</text>
  <text x="474" y="293" class="small">to closer and closer neighbors</text>

  <!-- ============ LSH ============ -->
  <rect x="680" y="44" width="200" height="270" rx="12" fill="#F6F8FA" stroke="#8C959F" stroke-width="1.5"/>
  <text x="694" y="66" class="tag" style="fill:#57606a">LSH</text>
  <text x="694" y="86" class="bold">Compare bit codes</text>
  <path d="M780,170 L872,104 L872,236 Z" fill="#E8EEF8"/>
  <g stroke="#8C959F" stroke-width="1.5">
    <line x1="692" y1="236" x2="872" y2="104"/>
    <line x1="692" y1="112" x2="872" y2="236"/>
  </g>
  <text x="772" y="120" class="code">10</text>
  <text x="840" y="176" class="code">11</text>
  <text x="772" y="232" class="code">01</text>
  <text x="702" y="176" class="code">00</text>
  <g fill="#8C959F">
    <circle cx="758" cy="140" r="4"/><circle cx="800" cy="128" r="4"/>
    <circle cx="828" cy="150" r="4"/><circle cx="852" cy="196" r="4"/>
    <circle cx="790" cy="214" r="4"/><circle cx="752" cy="206" r="4"/>
    <circle cx="716" cy="152" r="4"/><circle cx="728" cy="190" r="4"/>
  </g>
  <circle cx="830" cy="178" r="6" fill="#4C72B0"/>
  <text x="694" y="276" class="small">random planes give each vector</text>
  <text x="694" y="293" class="small">a short code; compare codes</text>

  <circle cx="26" cy="338" r="6" fill="#4C72B0"/>
  <text x="38" y="342" class="small">= the query. IVF, HNSW, and LSH are approximate: much faster than Flat, but they can miss some of the true nearest vectors.</text>
</svg>
