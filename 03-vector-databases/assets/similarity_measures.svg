<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-label="Three vectors q, a, and b, and how L2 distance, dot product, and cosine similarity compare them">
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .title { font-size: 18px; font-weight: 600; }
    .label { font-size: 14px; font-weight: 600; }
    .small { font-size: 12px; fill: #57606a; }
    .head { font-size: 12px; font-weight: 600; fill: #57606a; letter-spacing: 0.04em; }
    .cell { font-size: 14px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  </style>
  <defs>
    <marker id="arrow-q" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4C72B0"/></marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#DD8452"/></marker>
    <marker id="arrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#55A868"/></marker>
  </defs>
  <rect width="900" height="390" fill="#ffffff"/>
  <text x="20" y="32" class="title">Three ways to measure "close"</text>

  <!-- grid: origin (80, 330), 70 px per unit -->
  <g stroke="#EAEEF2" stroke-width="1">
    <line x1="80" y1="330" x2="80" y2="110"/><line x1="150" y1="330" x2="150" y2="110"/>
    <line x1="220" y1="330" x2="220" y2="110"/><line x1="290" y1="330" x2="290" y2="110"/>
    <line x1="80" y1="330" x2="310" y2="330"/><line x1="80" y1="260" x2="310" y2="260"/>
    <line x1="80" y1="190" x2="310" y2="190"/><line x1="80" y1="120" x2="310" y2="120"/>
  </g>
  <circle cx="80" cy="330" r="3" fill="#57606a"/>

  <!-- a = (3, 3) -->
  <line x1="80" y1="330" x2="288" y2="122" stroke="#DD8452" stroke-width="3" marker-end="url(#arrow-a)"/>
  <text x="270" y="108" class="label" style="fill:#DD8452">a = (3, 3)</text>
  <!-- q = (1, 1), drawn on top -->
  <line x1="80" y1="330" x2="148" y2="262" stroke="#4C72B0" stroke-width="4" marker-end="url(#arrow-q)"/>
  <text x="134" y="254" class="label" text-anchor="end" style="fill:#4C72B0">q = (1, 1)</text>
  <!-- b = (1, 0) -->
  <line x1="80" y1="330" x2="148" y2="330" stroke="#55A868" stroke-width="3" marker-end="url(#arrow-b)"/>
  <text x="156" y="352" class="label" style="fill:#55A868">b = (1, 0)</text>

  <!-- L2 distances between the tips -->
  <line x1="150" y1="260" x2="150" y2="328" stroke="#57606a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="158" y="300" class="small">L2 = 1.0</text>
  <line x1="160" y1="266" x2="296" y2="130" stroke="#57606a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="236" y="214" class="small">L2 = 2.83</text>

  <!-- angle between q and b -->
  <path d="M122,330 A42,42 0 0,0 109.7,300.3" fill="none" stroke="#57606a" stroke-width="1.5"/>
  <text x="125" y="319" class="small">45°</text>

  <!-- table -->
  <text x="390" y="78" class="head">MEASURE</text>
  <text x="640" y="78" class="head">q vs a</text>
  <text x="720" y="78" class="head">q vs b</text>
  <text x="800" y="78" class="head">CLOSER</text>
  <line x1="390" y1="88" x2="880" y2="88" stroke="#D0D7DE"/>

  <text x="390" y="116" class="cell" font-weight="600">L2 distance</text>
  <text x="390" y="134" class="small">length of the gap · smaller = closer</text>
  <text x="640" y="124" class="mono">2.83</text>
  <text x="720" y="124" class="mono">1.00</text>
  <text x="800" y="124" class="label" style="fill:#55A868">b</text>
  <line x1="390" y1="148" x2="880" y2="148" stroke="#EAEEF2"/>

  <text x="390" y="176" class="cell" font-weight="600">Dot product</text>
  <text x="390" y="194" class="small">direction × length · bigger = closer</text>
  <text x="640" y="184" class="mono">6.00</text>
  <text x="720" y="184" class="mono">1.00</text>
  <text x="800" y="184" class="label" style="fill:#DD8452">a</text>
  <line x1="390" y1="208" x2="880" y2="208" stroke="#EAEEF2"/>

  <text x="390" y="236" class="cell" font-weight="600">Cosine similarity</text>
  <text x="390" y="254" class="small">only the angle · bigger = closer</text>
  <text x="640" y="244" class="mono">1.00</text>
  <text x="720" y="244" class="mono">0.71</text>
  <text x="800" y="244" class="label" style="fill:#DD8452">a</text>
  <line x1="390" y1="268" x2="880" y2="268" stroke="#D0D7DE"/>

  <text x="390" y="298" class="small">a points the same way as q but is three times longer. The measures disagree because</text>
  <text x="390" y="316" class="small">they treat length differently. Scale every vector to length 1 (normalize), and all three</text>
  <text x="390" y="334" class="small">pick the same winner.</text>
</svg>
